<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cotta Master</title>
  </head>
  <body>
    <div id="root">
      <!-- Premium Instantly Visible Loading Screen -->
      <div style="background-color: #020617; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; color: #f8fafc; margin: 0; padding: 0;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 1.5rem;">
          <!-- Spinning glowing tennis ball icon -->
          <div style="position: relative; width: 68px; height: 68px;">
            <div style="position: absolute; inset: -10px; background: rgba(20, 184, 166, 0.12); filter: blur(14px); border-radius: 9999px;"></div>
            <div style="width: 100%; height: 100%; border-radius: 9999px; background: linear-gradient(135deg, #14b8a6, #2dd4bf); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(20, 184, 166, 0.35); animation: spinTennisBall 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;">
              <svg viewBox="0 0 24 24" fill="none" stroke="#020617" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="width: 34px; height: 34px;">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M6.2 6.2C8.2 10 8.2 14 6.2 17.8"></path>
                <path d="M17.8 6.2C15.8 10 15.8 14 17.8 17.8"></path>
              </svg>
            </div>
          </div>
          
          <!-- Branding Title -->
          <div style="text-align: center;">
            <h1 style="font-size: 1.15rem; font-weight: 900; letter-spacing: 0.12em; color: #ffffff; margin: 0; text-transform: uppercase;">COTTA MASTER</h1>
            <p style="font-size: 0.65rem; font-weight: 800; letter-spacing: 0.28em; color: #94a3b8; margin: 0.5rem 0 0 0; text-transform: uppercase;">Excel Sports Scheduler & Analyst</p>
          </div>
          
          <!-- Animated Progress Line -->
          <div style="width: 150px; height: 3px; background-color: #0f172a; border-radius: 9999px; overflow: hidden; border: 1px solid rgba(255,255,255,0.02); position: relative;">
            <div style="height: 100%; position: absolute; background: linear-gradient(90deg, #14b8a6, #2dd4bf); border-radius: 9999px; width: 40%; animation: barProgress 1.2s ease-in-out infinite alternate;"></div>
          </div>
        </div>
      </div>
      
      <style>
        @keyframes spinTennisBall {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes barProgress {
          0% { left: 0%; width: 35%; }
          100% { left: 65%; width: 35%; }
        }
        body {
          background-color: #020617;
          margin: 0;
          padding: 0;
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
